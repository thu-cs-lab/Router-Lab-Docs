<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Lab 1 network topology</title>
  <desc id="desc">Host A connects to Tofino front-panel port 9/0, device port 132. Tofino connects to the Linux control plane through CPU port 64.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446a9c"/>
    </marker>
  </defs>

  <rect width="1120" height="280" fill="#ffffff"/>

  <rect x="60" y="75" width="230" height="120" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="175" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Host A</text>
  <text x="175" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">192.168.1.2/24</text>

  <rect x="445" y="62" width="230" height="146" rx="6" fill="#eef4fb" stroke="#1e4f82" stroke-width="3"/>
  <text x="560" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#12395f">Tofino</text>
  <text x="560" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#334155">Gateway 192.168.1.1</text>

  <rect x="830" y="75" width="230" height="120" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="945" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Control plane</text>
  <text x="945" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#334155">Linux interface</text>

  <line x1="290" y1="135" x2="445" y2="135" stroke="#446a9c" stroke-width="4"/>
  <text x="367" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">9/0</text>
  <text x="367" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">device port 132</text>

  <line x1="675" y1="135" x2="820" y2="135" stroke="#446a9c" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="752" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">CPU port 64</text>
  <text x="752" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">CPU upload</text>
</svg>
